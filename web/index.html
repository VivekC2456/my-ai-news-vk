<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Highlights</title>
    <style>
        body { background: #000; color: #fff; font-family: -apple-system, sans-serif; padding: 20px; }
        .card { background: #1a1a1a; border-radius: 20px; padding: 20px; margin-bottom: 20px; border: 1px solid #333; }
        h2 { font-size: 18px; margin-top: 0; color: #00d4ff; }
        p { font-size: 15px; line-height: 1.5; color: #ccc; }
        a { color: #555; text-decoration: none; font-size: 12px; }
    </style>
</head>
<body>
    <h1>✨ World Updates</h1>
    <div id="content">Loading news...</div>
    <script>
        fetch('highlights.json').then(r => r.json()).then(data => {
            document.getElementById('content').innerHTML = data.map(item => `
                <div class="card">
                    <h2>${item.title}</h2>
                    <p>${item.summary}</p>
                    <a href="${item.url}">Source: Read More →</a>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
